# Kinematics solver configuration for bimanual SO-101 robot
#
# Defines IK/FK solvers for each planning group

# Left arm kinematics
left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
  position_only_ik: False  # compute position and orientation of the gripper

# Right arm kinematics
right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
  position_only_ik: False  # compute position and orientation of the gripper

# Both arms group (for coordinated bimanual planning)
both_arms:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.01  # Longer timeout for bimanual planning
  position_only_ik: False
