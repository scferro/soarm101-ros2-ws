# MoveIt controllers configuration for bimanual SO-101 robot
#
# Maps MoveIt planning groups to ros2_control controllers

# Controller manager
moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# Define the controllers used in ros2_control
moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - left_gripper_controller
    - right_arm_controller
    - right_gripper_controller

  # Left arm controller
  left_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - left_shoulder_pan
      - left_shoulder_lift
      - left_elbow_flex
      - left_wrist_flex
      - left_wrist_roll

  # Left gripper controller
  left_gripper_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - left_gripper

  # Right arm controller
  right_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - right_shoulder_pan
      - right_shoulder_lift
      - right_elbow_flex
      - right_wrist_flex
      - right_wrist_roll

  # Right gripper controller
  right_gripper_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - right_gripper
