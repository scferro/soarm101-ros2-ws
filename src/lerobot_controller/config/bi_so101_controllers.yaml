# Controller configuration for bimanual SO-101 robot
#
# This file defines controllers for both left and right arms.
# Each arm has two controllers:
#   - arm_controller: Controls the 5 arm joints (shoulder_pan to wrist_roll)
#   - gripper_controller: Controls the gripper joint

controller_manager:
  ros__parameters:
    update_rate: 10  # Hz

    # Left arm controllers
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Right arm controllers
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Joint state broadcaster (shared by both arms)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# Left arm controller configuration
left_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_pan
      - left_shoulder_lift
      - left_elbow_flex
      - left_wrist_flex
      - left_wrist_roll

    command_interfaces:
      - position

    state_interfaces:
      - position

    open_loop_control: true
    allow_integration_in_goal_trajectories: true

# Left gripper controller configuration
left_gripper_controller:
  ros__parameters:
    joints:
      - left_gripper

    command_interfaces:
      - position

    state_interfaces:
      - position

    open_loop_control: true
    allow_integration_in_goal_trajectories: true

# Right arm controller configuration
right_arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_pan
      - right_shoulder_lift
      - right_elbow_flex
      - right_wrist_flex
      - right_wrist_roll

    command_interfaces:
      - position

    state_interfaces:
      - position

    open_loop_control: true
    allow_integration_in_goal_trajectories: true

# Right gripper controller configuration
right_gripper_controller:
  ros__parameters:
    joints:
      - right_gripper

    command_interfaces:
      - position

    state_interfaces:
      - position

    open_loop_control: true
    allow_integration_in_goal_trajectories: true
